project:
  title: "Avaliações de aplicativos com IA · slides"
  output-dir: ../docs/slides
  render:
    - index.qmd

# Mesmo esquema visual dos slides de Marketing Analítico (revealjs + GSAP).
# As cenas animadas ficam em recursos/*.js e se registram no motor
# (recursos/motor.js). O quiz ao vivo fica em recursos/quiz-telao.js.

format:
  revealjs:
    theme: tema-insper.scss
    css:
      - recursos/fontes.css
      - recursos/componentes.css
      - recursos/aulas.css
      - recursos/cenas.css
      - recursos/quiz.css
    include-in-header:
      - text: |
          <script src="recursos/tema.js"></script>
    embed-resources: true
    slide-number: c/t
    show-slide-number: all
    history: false
    hash-type: number
    hash: true
    progress: true
    center: false
    width: 1280
    height: 760
    margin: 0.06
    min-scale: 0.2
    max-scale: 1.6
    transition: none
    background-transition: none
    highlight-style: github
    code-line-numbers: false
    code-copy: false
    auto-stretch: false
    menu: false
    lang: pt-BR

execute:
  echo: false
  warning: false
  message: false
